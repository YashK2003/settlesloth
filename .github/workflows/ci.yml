name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Node.js 20 Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies with clean slate
        run: npm ci

      - name: Verify JavaScript syntax
        run: |
          node --check server.js
          node --check src/presets.js
          node --check src/fallbackParser.js
          node --check src/reconciler.js
          node --check src/gemmaClient.js
          node --check public/app.js

      - name: Run automated test suite
        run: npm test
